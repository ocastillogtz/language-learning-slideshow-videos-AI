<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <!-- SVG country flags (Windows does not render flag emoji) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="root"><div class="boot">Loading…</div></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Pinned to a Babel 7.x build: defaults to the CLASSIC JSX runtime
       (React.createElement), so no `import` is generated. An unpinned URL can
       resolve to a newer build that defaults to the automatic runtime, which
       emits `import { jsx } from "react/jsx-runtime"` and breaks the no-build setup. -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <!-- JSX loader: each file is compiled once with Babel and cached in localStorage
       under a hash of its source, so later loads skip compiling (only changed files
       are recompiled). Files run in order in the global scope, exactly like the
       old <script type="text/babel"> tags. -->
  <script>
  (async function () {
    const FILES = [
      "/static/js/AppContext.js",
      "/static/js/api.js",
      "/static/js/components/Sidebar.js",
      "/static/js/components/Modals.js",
      "/static/js/components/PipelineTab.js",
      "/static/js/components/ItemsTab.js",
      "/static/js/components/ManifestTab.js",
      "/static/js/components/ProjectView.js",
      "/static/js/components/AssetsTab.js",
      "/static/js/components/SubtitlesTab.js",
      "/static/js/components/ConnectionsTab.js",
      "/static/js/components/SettingsView.js",
      "/static/js/App.js",
      "/static/js/index.js"
    ];
    const OPTS = { presets: ["react"], plugins: ["transform-block-scoping"] };
    async function hash(text) {
      const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
    }
    const sources = await Promise.all(FILES.map(f => fetch(f, { cache: "no-cache" }).then(r => r.text())));
    for (let i = 0; i < FILES.length; i++) {
      const f = FILES[i], src = sources[i], key = "jsx:" + f, h = await hash(src + Babel.version);
      let code = null;
      try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c && c.h === h) code = c.code; } catch (e) {}
      if (code === null) {
        try { code = Babel.transform(src, { ...OPTS, filename: f }).code; }
        catch (e) { console.error("JSX compile error in " + f, e); document.getElementById("root").textContent = "Compile error in " + f + ": " + e.message; return; }
        try { localStorage.setItem(key, JSON.stringify({ h, code })); } catch (e) {}
      }
      (0, eval)(code + "\n//# sourceURL=" + location.origin + f);
    }
  })();
  </script>
</body>
</html>
