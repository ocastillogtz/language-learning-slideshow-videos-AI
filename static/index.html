<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Learning Video Generator</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">German Learning Video Generator</h1>
                
                <!-- Create Project Button -->
                <div class="text-center mb-5">
                    <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#createProjectModal">
                        <i class="fas fa-plus-circle me-2"></i>Create New Project
                    </button>
                </div>
                
                <!-- Project List -->
                <div id="projectList" class="row">
                    <!-- Projects will be loaded here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="createProjectModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createProjectModalLabel">Create New Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <div class="mb-3">
                            <label for="projectTitle" class="form-label">Project Title</label>
                            <input type="text" class="form-control" id="projectTitle" placeholder="Enter project title" required>
                        </div>
                        <div class="mb-3">
                            <label for="sceneDescription" class="form-label">Scene Description</label>
                            <textarea class="form-control" id="sceneDescription" rows="3" placeholder="Describe the scene setting" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="learningPoints" class="form-label">Learning Points</label>
                            <textarea class="form-control" id="learningPoints" rows="3" placeholder="What language points should be covered?" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveProjectBtn">Create Project</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Handle form submission
        document.getElementById('saveProjectBtn').addEventListener('click', function() {
            const title = document.getElementById('projectTitle').value;
            const scene = document.getElementById('sceneDescription').value;
            const learning = document.getElementById('learningPoints').value;
            
            if (!title || !scene || !learning) {
                alert('Please fill in all fields');
                return;
            }
            
            // Create project via AJAX
            $.ajax({
                url: '/create_project',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    project_name: title,
                    scene: scene,
                    learning: learning
                }),
                success: function(response) {
                    alert('Project created successfully!');
                    // Close modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('createProjectModal'));
                    modal.hide();
                    // Reset form
                    document.getElementById('projectForm').reset();
                    // Reload project list
                    loadProjects();
                },
                error: function(xhr, status, error) {
                    alert('Error creating project: ' + error);
                }
            });
        });
        
        // Load projects on page load
        function loadProjects() {
            $.ajax({
                url: '/projects',
                method: 'GET',
                success: function(projects) {
                    const projectList = document.getElementById('projectList');
                    projectList.innerHTML = '';
                    
                    if (projects.length === 0) {
                        projectList.innerHTML = '<div class="col-12"><p class="text-center text-muted">No projects yet. Create your first project!</p></div>';
                        return;
                    }
                    
                    projects.forEach(function(project) {
                        const projectCard = `
                            <div class="col-md-4 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">${project.name}</h5>
                                        <p class="card-text">
                                            <small class="text-muted">Created: ${new Date(project.created_at).toLocaleDateString()}</small>
                                        </p>
                                        <a href="/project/${project.name}" class="btn btn-outline-primary btn-sm">View Details</a>
                                    </div>
                                </div>
                            </div>
                        `;
                        projectList.innerHTML += projectCard;
                    });
                },
                error: function() {
                    document.getElementById('projectList').innerHTML = '<div class="col-12"><p class="text-center text-danger">Error loading projects</p></div>';
                }
            });
        }
        
        // Load projects when page loads
        loadProjects();
    </script>
</body>
</html>
