[paths]
projects_dir = projects
assets_dir = assets

[tools]
imagemagick = C:\Program Files\ImageMagick-7.1.2-Q16-HDRI\magick.exe

[video]
target_w = 1080
target_h = 1920
fps = 30
dialogue_hold_s = 0.4
margin_blur_radius = 30
narrator_blur_radius = 18
blend_px = 120

[subtitles]
font = Calibri-Bold
fontsize = 76
color = BlanchedAlmond
stroke_color = tan4
stroke_width = 4
margin_bottom = 280
margin_left = 40
margin_right = 160
bg_opacity = 0.45
bg_padding_x = 20
bg_padding_y = 12

[narrator_subtitles]
font = Calibri-Bold
fontsize = 76
color = PeachPuff
stroke_color = sienna4
stroke_width = 4

[assembly]
fps = 30
bg_audio_volume = 0.25
crossfade_s = 0.35
bg_audio_fadein_s = 1.0
bg_audio_fadeout_s = 2.0

[images]
; provider: openai or local
provider = openai
openai_model = gpt-image-1.5
shorts_resolution = 1024x1536
landscape_resolution = 1536x1024
extend_pad_ratio = 0.12

[comfyui]
host = 127.0.0.1
port = 8000
; Style LoRA — always first in the chain, applied to every image
style_lora = brezelstyle_pytorch_lora_weights.safetensors
; Strength for the style LoRA
style_lora_strength = 0.5
; Strength for the speaking character's LoRA
char_lora_strength = 0.5
; Strength for background / non-speaking character LoRAs
bg_lora_strength = 0.2
; Short style tag injected into clip_l (the CLIP-L / short prompt encoder)
clip_l_tag = brezelstyle watercolor soft colors thick lining minimal detail
; How often to poll ComfyUI for completion (seconds)
poll_interval_s = 2.0
; Max time to wait for a single image before giving up (seconds)
timeout_s = 300.0

[audio]
elevenlabs_model = eleven_multilingual_v2
output_format = mp3_44100_128

[script]
openai_model = gpt-4.1-mini
level = B2
