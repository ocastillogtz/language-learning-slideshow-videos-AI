[paths]
projects_dir = projects
assets_dir = assets

[general]
log_level = INFO

[tools]
imagemagick = C:\Program Files\ImageMagick-7.1.2-Q16-HDRI\magick.exe

[video]
target_w = 1080
target_h = 1920
fps = 30
inter_pause_ms = 350
margin_blur_radius = 30
narrator_blur_radius = 12
blend_px = 120

; ── Per-orientation render overrides ─────────────────────────────────────────
; A project is "vertical" (Shorts/Reels) or "horizontal" (YouTube). At render time
; the matching section below overrides the base values above, using the internal
; parameter names. Anything omitted keeps the base value. These replace what used
; to be hardcoded for horizontal — tune each orientation here without touching code.
;   target_w / target_h  canvas size
;   sub_fontsize         dialogue subtitle size       nar_fontsize  narrator size
;   sub_margin_bottom    subtitle distance from the bottom edge
;   icon_x / icon_y      speaker-icon position        icon_size     speaker-icon size
;   fal_image_size       portrait_16_9 (vertical) / landscape_16_9 (horizontal)
; You can add ANY other internal key here too (e.g. annotated_font_size, repeat_fontsize).
[vertical]
target_w          = 1080
target_h          = 1920
sub_fontsize      = 42
nar_fontsize      = 96
sub_margin_bottom = 300
icon_x            = 700
icon_y            = 200
fal_image_size    = portrait_16_9

[horizontal]
target_w          = 1920
target_h          = 1080
sub_fontsize      = 60
nar_fontsize      = 110
sub_margin_bottom = 160
icon_x            = 1650
icon_y            = 50
fal_image_size    = landscape_16_9

[subtitles]
font = Calibri-Bold
fontsize = 42          ; base/fallback — per-orientation size is set in [vertical]/[horizontal] (sub_fontsize)
color = BlanchedAlmond
stroke_color = tan4
stroke_width = 2
margin_bottom = 300    ; base/fallback — per-orientation value is [vertical]/[horizontal] sub_margin_bottom
margin_left = 40
margin_right = 170
bg_opacity = 0.67
bg_padding_x = 20
bg_padding_y = 12
markup_italic_attrs   = font_style="italic"
markup_italic_colors  = #FFD700,#DBB900,#FFDD24,#B89B00,#FFE247
markup_bold_attrs     = weight="bold"

[footnote]
; Optional disclaimer/note overlay shown below the main subtitle.
font         =                  ; empty → falls back to sub_font
fontsize     = 42
color        = white
stroke_color = white
stroke_width = 0
gap          = 50
bg_opacity   = 0.67
; Extra silent time (ms) the scene is held AFTER the narration audio when a footnote
; is shown, so viewers have time to read it. 0 disables. Overridable per render.
hold_ms      = 4000

[repeat_prompt]
; Shadowing "intermediate" scene inserted after each dialog line: the same image
; with the subtitle still readable, plus a centered message (the "now repeat" cue).
; The message text and font are GLOBAL (shared by every repeat scene); the message
; and font size can also be overridden per render from the Video step UI.
text         = Jetzt wiederholen
font         =                  ; empty → falls back to the narrator font
fontsize     = 100
color        = PeachPuff
stroke_color = sienna4
stroke_width = 4
bg_opacity   = 0.67
; How long the repeat scene is held. 0 = mirror the dialog line's duration (best for
; shadowing); a value > 0 holds every repeat scene for that many milliseconds instead.
duration_ms  = 0
; When mirroring (duration_ms = 0), multiply the dialog length by this factor so the
; learner gets more time than the line took to speak (e.g. 1.5 = 50% longer). The
; factor can also be set per add/re-sync from the Generated Items tab.
duration_factor = 1.0

[countdown]
; Silent 3-2-1 countdown shown in the centre of the screen during a preposition_quiz
; round, over the situation image with the partial sentence + options still visible.
; No audio is emitted. per_number_ms = how long each digit (3, then 2, then 1) is held.
font         =                  ; empty → falls back to the narrator font
fontsize     = 220
color        = white
stroke_color = black
stroke_width = 6
per_number_ms = 800

[quiz_options]
; The three candidate prepositions shown as a horizontal row near the TOP of the screen
; during a preposition_quiz round. color_neutral is used before the answer is revealed;
; on the full-sentence reveal the correct option switches to color_correct (green) and the
; others fade to color_dim.
font         =                  ; empty → falls back to the narrator font
fontsize     = 66
color_neutral = white
color_correct = #2ecc40
color_dim     = #9aa0a6
stroke_color = black
stroke_width = 4
margin_top   = 120              ; px from the top edge to the top of the options row
gap          = 34               ; px horizontal gap between option chips
bg_opacity   = 0.55
bg_padding_x = 26
bg_padding_y = 14

[annotated_subtitles]
annotated_font_size = 60
annotated_note_size = 24

[narrator_subtitles]
font = Calibri-Bold
fontsize = 96          ; base/fallback — per-orientation size is set in [vertical]/[horizontal] (nar_fontsize)
color = PeachPuff
stroke_color = sienna4
stroke_width = 5

[character_icon]
x = 700
y = 200
size = 200

[assembly]
fps = 30
bg_audio_volume = 0.13
crossfade_s = 0.35
bg_audio_fadein_s = 1.0
bg_audio_fadeout_s = 2.0
speed_factor = 1.0

[reading]
; Overlays for the reading_together vertical part shorts.
; "Teil" = the word shown before the part number in the upper-left corner.
; Change it to localize (e.g. "Part", "Parte", "Partie").
part_label_word          = Teil
part_label_fontsize      = 64
part_label_color         = BlanchedAlmond
part_label_stroke_color  = tan4
part_label_stroke_width  = 3
part_label_margin_x      = 50
part_label_margin_y      = 50
part_label_bg_opacity    = 0.6
part_label_bg_padding_x  = 22
part_label_bg_padding_y  = 12
; End-card appended to every part except the last: a frozen last frame held for
; `continuation_seconds` with this centered legend. Change the text to localize
; (e.g. "To be continued...", "Continuará...", "À suivre...").
continuation_text         = Fortsetzung folgt...
continuation_seconds      = 2.0
continuation_fontsize     = 96
continuation_color        = PeachPuff
continuation_stroke_color = sienna4
continuation_stroke_width = 4
; Reading "pre-pause": before the narration of each reading sentence (except the
; very first one), the frame — image + sentence text — is held SILENTLY for this
; many milliseconds so the learner can try to read it first. Set 0 to disable.
pre_pause_ms              = 4000
; Book icon shown in the upper-left corner DURING the pre-pause (the "your turn to
; read" cue). Path is RELATIVE to the assets dir (assets/icons/book.png).
pre_pause_icon            = icons/book.png
pre_pause_icon_size       = 150
pre_pause_icon_margin_x   = 50
pre_pause_icon_margin_y   = 50

[audio]
elevenlabs_model = eleven_multilingual_v2
output_format = mp3_44100_128

[repetition]
pause_factor = 1.3

[script]
openai_model = gpt-4.1-mini
level = B2
; Max distinct characters drawn into ONE scene image. The video's overall cast can
; be larger (multi-character types); each scene is capped here for image quality.
; 1 = always solo, 2 = speaker + one other.
max_scene_characters = 2
; Long dialogs are generated AND evaluated in chunks of this many lines so a single
; request never hits the model's output-token ceiling (which silently truncates the
; result). Batching only activates when an explicit dialog count exceeds this value.
dialog_batch_size = 40

[review]
; GPT model used by review_manifest.py to proofread the generated script.
; Requires OPENAI_API_KEY in the environment (see .env.example).
openai_model = gpt-4.1

[fal]
; Default image (edit) model — a key from [fal_models] below, or a full fal endpoint id.
; The UI dropdown starts on this model; picking another there only affects that run.
model = seedream-5-lite
t2i_model = fal-ai/bytedance/seedream/v5/lite/text-to-image
image_size = portrait_16_9

; Image models selectable in the UI dropdown: key = fal endpoint id.
[fal_models]
seedream-4.5 = fal-ai/bytedance/seedream/v4.5/edit
seedream-5-lite = fal-ai/bytedance/seedream/v5/lite/edit

[image_prompts]
; Style tokens prepended to every scene image prompt.
; Change this to switch the overall art style of all generated images.
style_tokens = Soft watercolor children's book illustration. Loose, gentle watercolor washes with visible paper texture and light, even pigment gradients; warm muted pastel palette. Clean, even, dark hand-drawn outlines of consistent medium weight around every shape. Simple, low-complexity composition with few elements and an uncluttered background; flat soft color fills with minimal soft shading and no harsh shadows or heavy detail. Friendly, rounded cartoon proportions with small, simple facial features. The elements in the location must stay where they are in the reference: furniture, appliances, decoration and surrounding objects must stay in place and remain consistent. If characters are shown on a white background, integrate them naturally into the given location; the final image must NOT have a white background behind the characters. No text, no subtitles, no speech bubbles, no watermarks. EYE STYLE (brand-critical): draw eyes as simple solid upright oval/ellipse shapes (taller than wide), filled with a single dark colour. NO visible white of the eye / no sclera, no glossy anime-style eyes, no large reflective highlights, no white catchlights.

; Framing/composition tokens appended after the style tokens.
framing_tokens = vertical 9:16 composition. The main subject (characters) MUST be positioned at the vertical center of the image — do NOT place them near the top or bottom. Horizontally, center the subjects slightly left of center (roughly 40-50% from the left edge). Characters occupy no more than 60% of the frame height, leaving clear breathing room above and below. Generous white margins at all four edges — the scene fades into a soft white vignette that transitions gradually inward from every edge, like a framed illustration floating on white. No character or object touches the outer 15% of any edge.

; Style suffix appended to character art generation prompts.
character_art_style = Soft watercolor children's book illustration of a single full-body character. Gentle watercolor washes with light paper texture, warm muted pastel palette, clean even dark outlines of consistent weight, flat soft color fills with minimal soft shading. Friendly rounded cartoon proportions with small simple facial features. Plain white background. No text, no watermarks. EYE STYLE (brand-critical): draw eyes as simple solid upright oval/ellipse shapes (taller than wide), filled with a single dark colour. NO visible white of the eye / no sclera, no glossy anime-style eyes, no large reflective highlights, no white catchlights.

; Style suffix appended to location art generation prompts.
location_art_style = Soft watercolor children's book illustration of a location background only. Gentle watercolor washes with light paper texture, warm muted pastel palette, clean even dark outlines, simple low-complexity composition, flat soft color fills with minimal shading. No people, no characters, no text, no watermarks. Vertical 9:16 composition. EYE STYLE (brand-critical): draw eyes as simple solid upright oval/ellipse shapes (taller than wide), filled with a single dark colour. NO visible white of the eye / no sclera, no glossy anime-style eyes, no large reflective highlights, no white catchlights.

[comfyui]
host = 127.0.0.1
port = 8000
style_lora = brezelstyle_pytorch_lora_weights.safetensors
style_lora_strength = 0.6
char_lora_strength = 0.7
steps = 20
char_steps = 36
seed = 0
poll_interval_s = 2.0
timeout_s = 300.0
canvas_w = 1024
canvas_h = 1536
char_canvas_w = 512
