[paths]
projects_dir = projects
assets_dir = assets

[general]
log_level = INFO

[tools]
imagemagick = C:\Program Files\ImageMagick-7.1.2-Q16-HDRI\magick.exe

[video]
target_w = 1080
target_h = 1920
fps = 30
inter_pause_ms = 350
margin_blur_radius = 30
narrator_blur_radius = 12
blend_px = 120

[subtitles]
font = Calibri-Bold
fontsize = 42
color = BlanchedAlmond
stroke_color = tan4
stroke_width = 4
margin_bottom = 300
margin_left = 40
margin_right = 170
bg_opacity = 0.45
bg_padding_x = 20
bg_padding_y = 12
markup_italic_attrs   = font_style="italic"
markup_italic_colors  = #FFD700,#DBB900,#FFDD24,#B89B00,#FFE247
markup_bold_attrs     = weight="bold"

[footnote]
; Optional disclaimer/note overlay shown below the main subtitle.
font         =                  ; empty → falls back to sub_font
fontsize     = 32
color        = white
stroke_color = white
stroke_width = 0
gap          = 50
bg_opacity   = 0.45

[annotated_subtitles]
annotated_font_size = 60
annotated_note_size = 24

[narrator_subtitles]
font = Calibri-Bold
fontsize = 76
color = PeachPuff
stroke_color = sienna4
stroke_width = 4

[character_icon]
x = 700
y = 200
size = 200

[assembly]
fps = 30
bg_audio_volume = 0.13
crossfade_s = 0.35
bg_audio_fadein_s = 1.0
bg_audio_fadeout_s = 2.0
speed_factor = 1.0

[audio]
elevenlabs_model = eleven_multilingual_v2
output_format = mp3_44100_128

[repetition]
pause_factor = 1.3

[script]
openai_model = gpt-4.1-mini
level = B2

[fal]
model = fal-ai/bytedance/seedream/v5/lite/edit
t2i_model = fal-ai/bytedance/seedream/v5/lite/text-to-image
image_size = portrait_16_9

[image_prompts]
; Style tokens prepended to every scene image prompt.
; Change this to switch the overall art style of all generated images.
style_tokens = children's illustration book style, smooth watercolor washes, even color gradients, uniform color fills, thick clean outlines, soft pastel palette, no blooms or cauliflowers. The elements in the locations must stay where they are in the reference. furniture, appliances, decoration, mobiliary must stay where it is. The objects in the surroundings must be consistent. If characters shown have a white background this means they must be integrated to the image of the location given. The end result must not have white background behind the characters.

; Framing/composition tokens appended after the style tokens.
framing_tokens = vertical 9:16 composition. The main subject (characters) MUST be positioned at the vertical center of the image — do NOT place them near the top or bottom. Horizontally, center the subjects slightly left of center (roughly 40-50% from the left edge). Characters occupy no more than 60% of the frame height, leaving clear breathing room above and below. Generous white margins at all four edges — the scene fades into a soft white vignette that transitions gradually inward from every edge, like a framed illustration floating on white. No character or object touches the outer 15% of any edge.

; Style suffix appended to character art generation prompts.
character_art_style = children's illustration book style, smooth watercolor washes, thick clean outlines, soft pastel palette, white background, no text, no watermarks

; Style suffix appended to location art generation prompts.
location_art_style = children's illustration book style, smooth watercolor washes, thick clean outlines, soft pastel palette. No people, no characters, no text, no watermarks. Vertical 9:16 composition.

[comfyui]
host = 127.0.0.1
port = 8000
style_lora = brezelstyle_pytorch_lora_weights.safetensors
style_lora_strength = 0.6
char_lora_strength = 0.7
steps = 20
char_steps = 36
seed = 0
poll_interval_s = 2.0
timeout_s = 300.0
canvas_w = 1024
canvas_h = 1536
char_canvas_w = 512
